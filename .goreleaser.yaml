version: 2

project_name: dev-vault

builds:
  - id: dev-vault
    main: ./cmd/dev-vault
    binary: dev-vault
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - dev-vault
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: dev-vault
    package_name: dev-vault
    maintainer: bsmartlabs <dev@bsmartlabs.com>
    vendor: bsmartlabs
    homepage: https://github.com/bsmartlabs/dev-vault
    description: Scaleway Secret Manager CLI to sync -dev secrets to disk for local development
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
