name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Gitleaks
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          version="${tag#v}"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
            i386|i686) arch="x32" ;;
            *) echo "unsupported arch: $arch" >&2; exit 2 ;;
          esac

          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${version}_linux_${arch}.tar.gz"
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp"
          "$tmp/gitleaks" detect --redact --verbose

      - name: Test (100% coverage)
        run: |
          set -euo pipefail
          go test ./... -coverprofile=coverage.out
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}')"
          if [ "$total" != "100.0%" ]; then
            echo "coverage is $total, expected 100.0%"
            exit 1
          fi

      - name: Provider contract gate
        run: |
          set -euo pipefail
          go test ./internal/secretprovider/scaleway -run 'Test(Open_ProfileResolution|ScalewaySecretAPI_|ToScalewaySecretType)'

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package repos (Homebrew + Scoop)
        continue-on-error: true
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN}" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not set; skipping tap update."
            exit 0
          fi
          chmod +x scripts/update-package-repos.sh
          scripts/update-package-repos.sh \
            --repo bsmartlabs/dev-vault \
            --tag "${RELEASE_TAG}" \
            --tap bsmartlabs/homebrew-dev-tools \
            --token "${HOMEBREW_TAP_GITHUB_TOKEN}"
